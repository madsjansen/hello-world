<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
</head>
<body>
<title>Træningslog</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-wash: rgba(42, 120, 214, 0.08);
    --good: #006300;
    --good-wash: rgba(12, 163, 12, 0.10);
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --accent-ink: #ffffff;
      --accent-wash: rgba(57, 135, 229, 0.14);
      --good: #0ca30c;
      --good-wash: rgba(12, 163, 12, 0.16);
      --critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-wash: rgba(57, 135, 229, 0.14);
    --good: #0ca30c;
    --good-wash: rgba(12, 163, 12, 0.16);
    --critical: #e66767;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-wash: rgba(42, 120, 214, 0.08);
    --good: #006300;
    --good-wash: rgba(12, 163, 12, 0.10);
    --critical: #d03b3b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }
  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 12px calc(48px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  header.masthead { padding: 8px 4px 4px; }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead p.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }

  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    margin-bottom: 4px;
  }
  select, input[type="number"], input[type="date"] {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--page);
    border: 1px solid var(--baseline);
    border-radius: 8px;
  }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; text-align: center; font-weight: 600; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .stepper {
    display: flex;
    align-items: stretch;
    gap: 6px;
  }
  .stepper input { flex: 1; min-width: 0; }
  .stepper button.step {
    flex: 0 0 52px;
    min-height: 48px;
    padding: 0;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    background: var(--accent-wash);
    border: 1px solid var(--baseline);
    border-radius: 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  .stepper button.step:active { filter: brightness(0.92); }
  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .exercise-note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .last-entry {
    margin: 10px 0 0;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--ink-2);
    background: var(--accent-wash);
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }

  form.log-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 12px;
  }
  form.log-grid .full { grid-column: 1 / -1; }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--baseline);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 16px;
    touch-action: manipulation;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    font-size: 17px;
    min-height: 54px;
    padding: 12px 16px;
  }
  button.ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-2);
    font-size: 13px;
    padding: 10px 14px;
    min-height: 44px;
  }
  button.danger-link {
    background: none;
    border: none;
    color: var(--critical);
    font-size: 13px;
    padding: 12px 10px;
    min-height: 44px;
  }
  @media (hover: hover) {
    button.primary:hover { filter: brightness(1.08); }
    button.ghost:hover { background: var(--accent-wash); }
  }

  .toast {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    background: var(--good-wash);
    color: var(--good);
    display: none;
  }
  .toast.show { display: block; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat .stat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat .stat-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .stat .stat-value.up { color: var(--good); }
  .stat .stat-sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .segmented {
    display: inline-flex;
    gap: 0;
    border: 1px solid var(--baseline);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .segmented button {
    border: none;
    border-radius: 0;
    background: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    padding: 7px 14px;
  }
  .segmented button + button { border-left: 1px solid var(--baseline); }
  .segmented button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--page);
    font-size: 12px;
    line-height: 1.45;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    transform: translate(-50%, calc(-100% - 12px));
    display: none;
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }
  .chart-note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 10px 6px 0;
    border-bottom: 1px solid var(--baseline);
    white-space: nowrap;
  }
  td {
    padding: 8px 10px 8px 0;
    border-bottom: 1px solid var(--grid);
    white-space: nowrap;
  }
  td.num, th.num { text-align: right; }
  td .pr-chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--good);
    background: var(--good-wash);
    border-radius: 99px;
    padding: 1px 8px;
    margin-left: 6px;
  }

  footer.data-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 4px;
  }
  footer.data-actions .spacer { flex: 1; }
  footer.data-actions p { width: 100%; margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .stat .stat-value { font-size: 18px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    button.primary { transition: filter 120ms ease; }
    button.ghost { transition: background 120ms ease; }
  }
</style>

<div class="app">
  <header class="masthead">
    <p class="eyebrow">Personlig træningslog</p>
    <h1>Styrke&shy;fremgang</h1>
    <p class="sub">Registrér øvelse, vægt, sæt og reps — og se din udvikling over tid.</p>
  </header>

  <section class="card" aria-labelledby="pick-h">
    <h2 id="pick-h">Øvelse</h2>
    <label class="field-label" for="exercise-select">Vælg øvelse</label>
    <select id="exercise-select"></select>
    <p class="exercise-note" id="exercise-note" hidden></p>
    <p class="last-entry" id="last-entry" hidden></p>
  </section>

  <section class="card" aria-labelledby="log-h">
    <h2 id="log-h">Registrér træning</h2>
    <form class="log-grid" id="log-form">
      <div class="full">
        <label class="field-label" for="in-weight">Vægt (kg)</label>
        <div class="stepper">
          <button type="button" class="step" data-step="-2.5" data-for="in-weight" aria-label="2,5 kg mindre">−2,5</button>
          <input id="in-weight" type="number" inputmode="decimal" step="0.25" min="0" required>
          <button type="button" class="step" data-step="2.5" data-for="in-weight" aria-label="2,5 kg mere">+2,5</button>
        </div>
      </div>
      <div>
        <label class="field-label" for="in-sets">Sæt</label>
        <div class="stepper">
          <button type="button" class="step" data-step="-1" data-for="in-sets" aria-label="Ét sæt mindre">−</button>
          <input id="in-sets" type="number" inputmode="numeric" step="1" min="1" max="20" required>
          <button type="button" class="step" data-step="1" data-for="in-sets" aria-label="Ét sæt mere">+</button>
        </div>
      </div>
      <div>
        <label class="field-label" for="in-reps">Reps</label>
        <div class="stepper">
          <button type="button" class="step" data-step="-1" data-for="in-reps" aria-label="Én rep mindre">−</button>
          <input id="in-reps" type="number" inputmode="numeric" step="1" min="1" max="100" required>
          <button type="button" class="step" data-step="1" data-for="in-reps" aria-label="Én rep mere">+</button>
        </div>
      </div>
      <button type="submit" class="primary full">Gem registrering</button>
    </form>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="prog-h">
    <h2 id="prog-h">Fremgang</h2>
    <div class="stat-row" id="stat-row"></div>
    <div class="segmented" role="group" aria-label="Målepunkt" id="metric-group">
      <button type="button" data-metric="weight" aria-pressed="true">Vægt</button>
      <button type="button" data-metric="volume" aria-pressed="false">Volumen</button>
      <button type="button" data-metric="e1rm" aria-pressed="false">Est. 1RM</button>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <div class="tooltip" id="tooltip"></div>
    </div>
    <p class="chart-note" id="chart-note" hidden></p>
  </section>

  <section class="card" aria-labelledby="hist-h">
    <h2 id="hist-h">Historik</h2>
    <div class="table-scroll">
      <table id="history-table">
        <thead>
          <tr>
            <th>Dato</th>
            <th class="num">Vægt</th>
            <th class="num">Sæt × reps</th>
            <th class="num">Volumen</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </section>

  <footer class="data-actions">
    <button type="button" class="ghost" id="btn-export">Eksportér data</button>
    <button type="button" class="ghost" id="btn-import">Importér data</button>
    <input type="file" id="import-file" accept="application/json" hidden>
    <span class="spacer"></span>
    <button type="button" class="danger-link" id="btn-reset">Nulstil alt</button>
    <p>Data gemmes kun i denne browser. Eksportér jævnligt som backup.</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var KEY = "traeningslog-v1";
  var nfKg = new Intl.NumberFormat("da-DK", { maximumFractionDigits: 2 });
  var nfInt = new Intl.NumberFormat("da-DK", { maximumFractionDigits: 0 });
  var dfShort = new Intl.DateTimeFormat("da-DK", { day: "numeric", month: "short" });
  var dfLong = new Intl.DateTimeFormat("da-DK", { day: "numeric", month: "short", year: "numeric" });
  var tfShort = new Intl.DateTimeFormat("da-DK", { hour: "2-digit", minute: "2-digit" });

  var SEED_EXERCISES = [
    { id: "chest-press-stretch", group: "Arme og bryst", name: "Chest press (mest stretch)", start: 70 },
    { id: "triceps-rope-1", group: "Arme og bryst", name: "Triceps pulldown rope", start: 17.5 },
    { id: "kabel-curls", group: "Arme og bryst", name: "Kabel curls (nedefra)", start: 35 },
    { id: "hammer-curls-1", group: "Arme og bryst", name: "Hammer curls", start: 16 },
    { id: "alm-curls", group: "Arme og bryst", name: "Alm. curls", start: 18 },
    { id: "preacher-curls", group: "Arme og bryst", name: "Preacher curls", start: 20.5, note: "Vægt er samlet." },
    { id: "row-laen-ind-1", group: "Ryg og skuldre", name: "Row (læn ind)", start: 55, note: "Vægt i alt." },
    { id: "lat-pull-down", group: "Ryg og skuldre", name: "Lat pull down", start: 80, note: "Inline med hofte, albuer ned — ikke bagud. Erstat evt. med cable pull down. Vægt i alt." },
    { id: "overhead-press", group: "Ryg og skuldre", name: "Overhead press", start: 40, note: "Startvægt sat til 40 kg (20 kg stang + 10 kg pr. side) — ret hvis det ikke passer." },
    { id: "squat", group: "Leg day", name: "Squat", start: 40, note: "Startvægt sat til 40 kg (20 kg stang + 10 kg pr. side) — ret hvis det ikke passer." },
    { id: "lower-back", group: "Ryg", name: "Lower back", start: 65 },
    { id: "pull-down", group: "Ryg", name: "Pull down", start: 90, note: "Vægt i alt." },
    { id: "row-laen-ind-2", group: "Ryg", name: "Row (læn ind, per arm)", start: 40, note: "Vægt per arm." },
    { id: "pullups-hjaelp", group: "Ryg", name: "Pullups med hjælp", start: 20, invert: true, note: "Hjælpevægt — lavere vægt er fremgang." },
    { id: "chest-press-2", group: "Bryst", name: "Chest press", start: 60 },
    { id: "cable-chest-fly", group: "Bryst", name: "Cable chest fly" },
    { id: "bench-press", group: "Bryst", name: "Bench press", start: 47.5, note: "Stang på 20 kg." },
    { id: "incline-bench", group: "Bryst", name: "Incline bench", start: 35 },
    { id: "delts-machine", group: "Skulder", name: "Delts machine", start: 40 },
    { id: "shoulder-press", group: "Skulder", name: "Shoulder press", start: 55 },
    { id: "dumbbell-raises", group: "Skulder", name: "Dumbbell raises" },
    { id: "triceps-rope-2", group: "Arme", name: "Triceps pulldown rope (tung)", start: 22.5 },
    { id: "triceps-bar", group: "Arme", name: "Triceps pulldown bar", start: 25 },
    { id: "curls-2", group: "Arme", name: "Curls", start: 16 },
    { id: "hammer-curls-2", group: "Arme", name: "Hammer curls (arme-dag)" }
  ];

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function uid() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function seedState() {
    var entries = [];
    var today = todayISO();
    SEED_EXERCISES.forEach(function (ex) {
      if (typeof ex.start === "number") {
        entries.push({ id: uid(), exId: ex.id, date: today, weight: ex.start, sets: null, reps: null, seed: true });
      }
    });
    return {
      exercises: SEED_EXERCISES.map(function (ex) {
        return { id: ex.id, group: ex.group, name: ex.name, note: ex.note || null, invert: !!ex.invert };
      }),
      entries: entries,
      ui: { exId: "bench-press", metric: "weight" }
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.exercises) && Array.isArray(s.entries)) {
          s.ui = s.ui || { exId: s.exercises[0].id, metric: "weight" };
          return s;
        }
      }
    } catch (e) { /* korrupt data → frisk start */ }
    var fresh = seedState();
    saveState(fresh);
    return fresh;
  }

  function saveState(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* fuld storage */ }
  }

  var state = loadState();

  var $ = function (id) { return document.getElementById(id); };
  var selectEl = $("exercise-select");
  var noteEl = $("exercise-note");
  var lastEl = $("last-entry");
  var formEl = $("log-form");
  var wEl = $("in-weight"), sEl = $("in-sets"), rEl = $("in-reps");
  var toastEl = $("toast");
  var statRowEl = $("stat-row");
  var metricGroup = $("metric-group");
  var chartWrap = $("chart-wrap");
  var tooltipEl = $("tooltip");
  var chartNoteEl = $("chart-note");
  var historyBody = $("history-body");

  function currentExercise() {
    for (var i = 0; i < state.exercises.length; i++) {
      if (state.exercises[i].id === state.ui.exId) return state.exercises[i];
    }
    return state.exercises[0];
  }

  function entriesFor(exId) {
    return state.entries
      .filter(function (e) { return e.exId === exId; })
      .sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return (a.ts || 0) - (b.ts || 0);
      });
  }

  function e1rm(entry) {
    if (entry.reps == null) return null;
    return entry.weight * (1 + entry.reps / 30);
  }

  function volume(entry) {
    if (entry.sets == null || entry.reps == null) return null;
    return entry.weight * entry.sets * entry.reps;
  }

  function parseDate(iso) {
    var p = iso.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  /* ---------- Øvelsesvælger ---------- */
  function renderSelect() {
    selectEl.innerHTML = "";
    var groups = {};
    state.exercises.forEach(function (ex) {
      if (!groups[ex.group]) {
        groups[ex.group] = document.createElement("optgroup");
        groups[ex.group].label = ex.group;
        selectEl.appendChild(groups[ex.group]);
      }
      var opt = document.createElement("option");
      opt.value = ex.id;
      opt.textContent = ex.name;
      groups[ex.group].appendChild(opt);
    });
    selectEl.value = state.ui.exId;
  }

  function renderExerciseMeta() {
    var ex = currentExercise();
    if (ex.note) { noteEl.textContent = ex.note; noteEl.hidden = false; }
    else { noteEl.hidden = true; }

    var list = entriesFor(ex.id);
    var last = list[list.length - 1];
    if (last) {
      var parts = ["Sidst: " + nfKg.format(last.weight) + " kg"];
      if (last.sets != null && last.reps != null) parts.push(last.sets + " × " + last.reps);
      parts.push(dfShort.format(parseDate(last.date)));
      lastEl.textContent = parts.join(" · ");
      lastEl.hidden = false;
      wEl.value = last.weight;
      if (last.sets != null) sEl.value = last.sets;
      if (last.reps != null) rEl.value = last.reps;
    } else {
      lastEl.hidden = true;
      wEl.value = "";
    }
    if (!sEl.value) sEl.value = 3;
    if (!rEl.value) rEl.value = 8;
  }

  /* ---------- Statistik ---------- */
  function renderStats() {
    var ex = currentExercise();
    var list = entriesFor(ex.id);
    statRowEl.innerHTML = "";
    if (!list.length) return;

    var latest = list[list.length - 1];
    var first = list[0];
    var best = list.reduce(function (m, e) {
      return ex.invert ? Math.min(m, e.weight) : Math.max(m, e.weight);
    }, list[0].weight);
    var delta = latest.weight - first.weight;
    var progressed = ex.invert ? delta < 0 : delta > 0;
    var pct = first.weight !== 0 ? (delta / first.weight) * 100 : 0;

    function tile(label, value, sub, up) {
      var div = document.createElement("div");
      div.className = "stat";
      div.innerHTML =
        '<div class="stat-label"></div><div class="stat-value' + (up ? " up" : "") + '"></div><div class="stat-sub"></div>';
      div.children[0].textContent = label;
      div.children[1].textContent = value;
      div.children[2].textContent = sub || "";
      statRowEl.appendChild(div);
    }

    tile("Seneste", nfKg.format(latest.weight) + " kg", dfShort.format(parseDate(latest.date)), false);
    tile("Bedste", nfKg.format(best) + " kg", ex.invert ? "laveste hjælp" : "", false);
    tile(
      "Fremgang",
      (delta > 0 ? "+" : "") + nfKg.format(delta) + " kg",
      (pct > 0 ? "+" : "") + nfKg.format(Math.round(pct * 10) / 10) + " % siden start",
      progressed
    );
  }

  /* ---------- Diagram ---------- */
  var METRIC_LABEL = { weight: "Vægt (kg)", volume: "Volumen (kg)", e1rm: "Estimeret 1RM (kg)" };

  function chartPoints(ex, metric) {
    var list = entriesFor(ex.id);
    var byDate = {};
    list.forEach(function (e) {
      var v = metric === "weight" ? e.weight : metric === "volume" ? volume(e) : e1rm(e);
      if (v == null) return;
      if (byDate[e.date] == null) byDate[e.date] = { date: e.date, value: v, entry: e };
      else {
        var better = metric === "volume" ? byDate[e.date].value + v
          : ex.invert && metric === "weight" ? Math.min(byDate[e.date].value, v)
          : Math.max(byDate[e.date].value, v);
        if (metric === "volume") byDate[e.date].value = better;
        else if (better !== byDate[e.date].value) { byDate[e.date].value = better; byDate[e.date].entry = e; }
      }
    });
    return Object.keys(byDate).sort().map(function (k) { return byDate[k]; });
  }

  function niceTicks(min, max, count) {
    if (min === max) { min = min - Math.max(1, Math.abs(min) * 0.1); max = max + Math.max(1, Math.abs(max) * 0.1); }
    var span = max - min;
    var step = Math.pow(10, Math.floor(Math.log10(span / count)));
    var err = (span / count) / step;
    if (err >= 7.5) step *= 10; else if (err >= 3.5) step *= 5; else if (err >= 1.5) step *= 2.5;
    var lo = Math.floor(min / step) * step;
    var hi = Math.ceil(max / step) * step;
    var ticks = [];
    for (var v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return { ticks: ticks, lo: lo, hi: hi };
  }

  var chartGeom = null;

  function renderChart() {
    var ex = currentExercise();
    var metric = state.ui.metric;
    var pts = chartPoints(ex, metric);

    var old = chartWrap.querySelector("svg, .chart-empty");
    if (old) old.remove();
    tooltipEl.style.display = "none";
    chartGeom = null;

    chartNoteEl.hidden = true;
    if (ex.invert) {
      chartNoteEl.textContent = "Denne øvelse bruger hjælpevægt: en faldende kurve er fremgang.";
      chartNoteEl.hidden = false;
    } else if (metric !== "weight") {
      chartNoteEl.textContent = metric === "volume"
        ? "Volumen = vægt × sæt × reps, lagt sammen pr. dag. Startvægte uden sæt/reps indgår ikke."
        : "Estimeret 1RM (Epley): vægt × (1 + reps/30). Startvægte uden reps indgår ikke.";
      chartNoteEl.hidden = false;
    }

    if (pts.length === 0) {
      var empty = document.createElement("div");
      empty.className = "chart-empty";
      empty.textContent = metric === "weight"
        ? "Ingen registreringer endnu — gem din første træning ovenfor."
        : "Ingen registreringer med sæt og reps endnu for denne måling.";
      chartWrap.appendChild(empty);
      return;
    }

    var W = Math.max(280, chartWrap.clientWidth);
    var H = 240;
    var pad = { top: 18, right: 52, bottom: 28, left: 40 };
    var iw = W - pad.left - pad.right;
    var ih = H - pad.top - pad.bottom;

    var values = pts.map(function (p) { return p.value; });
    var vMin = Math.min.apply(null, values);
    var vMax = Math.max.apply(null, values);
    var scale = niceTicks(vMin, vMax, 4);

    var t0 = parseDate(pts[0].date).getTime();
    var t1 = parseDate(pts[pts.length - 1].date).getTime();
    if (t0 === t1) { t0 -= 86400000; t1 += 86400000; }

    function X(t) { return pad.left + ((t - t0) / (t1 - t0)) * iw; }
    function Y(v) { return pad.top + (1 - (v - scale.lo) / (scale.hi - scale.lo)) * ih; }

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", METRIC_LABEL[metric] + " over tid for " + ex.name);

    function el(name, attrs, text) {
      var n = document.createElementNS(svgNS, name);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text != null) n.textContent = text;
      return n;
    }
    var css = getComputedStyle(document.documentElement);
    function tok(name) { return css.getPropertyValue(name).trim(); }
    var C = {
      grid: tok("--grid"), baseline: tok("--baseline"), muted: tok("--muted"),
      accent: tok("--accent"), surface: tok("--surface"), ink: tok("--ink")
    };

    scale.ticks.forEach(function (tv) {
      var y = Y(tv);
      svg.appendChild(el("line", { x1: pad.left, x2: W - pad.right, y1: y, y2: y, stroke: C.grid, "stroke-width": 1 }));
      svg.appendChild(el("text", {
        x: pad.left - 8, y: y + 4, "text-anchor": "end", "font-size": 11,
        fill: C.muted, "font-family": "inherit", style: "font-variant-numeric: tabular-nums"
      }, nfKg.format(tv)));
    });
    svg.appendChild(el("line", {
      x1: pad.left, x2: W - pad.right, y1: pad.top + ih, y2: pad.top + ih,
      stroke: C.baseline, "stroke-width": 1
    }));

    /* Datoetiketter: altid første og sidste punkt; mellemliggende kun hvis der
       er mindst 64 px fri plads til begge naboer, så etiketter aldrig kolliderer. */
    var MIN_GAP = 64;
    var xs = pts.map(function (p) { return X(parseDate(p.date).getTime()); });
    var tickIdx = [0];
    if (pts.length > 1) {
      for (var i = 1; i < pts.length - 1; i++) {
        if (xs[i] - xs[tickIdx[tickIdx.length - 1]] >= MIN_GAP && xs[pts.length - 1] - xs[i] >= MIN_GAP) {
          tickIdx.push(i);
        }
      }
      tickIdx.push(pts.length - 1);
    }
    tickIdx.forEach(function (idx) {
      svg.appendChild(el("text", {
        x: xs[idx], y: H - 8,
        "text-anchor": idx === 0 ? "start" : idx === pts.length - 1 ? "end" : "middle",
        "font-size": 11, fill: C.muted, "font-family": "inherit"
      }, dfShort.format(parseDate(pts[idx].date))));
    });

    var lineD = "", areaD = "";
    pts.forEach(function (p, j) {
      var x = X(parseDate(p.date).getTime()), y = Y(p.value);
      lineD += (j === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    if (pts.length > 1) {
      areaD = lineD +
        "L" + X(parseDate(pts[pts.length - 1].date).getTime()).toFixed(1) + " " + (pad.top + ih) +
        "L" + X(parseDate(pts[0].date).getTime()).toFixed(1) + " " + (pad.top + ih) + "Z";
      svg.appendChild(el("path", { d: areaD, fill: C.accent, opacity: 0.08 }));
      svg.appendChild(el("path", {
        d: lineD, fill: "none", stroke: C.accent, "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round"
      }));
    }

    var crosshair = el("line", { y1: pad.top, y2: pad.top + ih, stroke: C.baseline, "stroke-width": 1, opacity: 0 });
    svg.appendChild(crosshair);

    pts.forEach(function (p, j) {
      var x = X(parseDate(p.date).getTime()), y = Y(p.value);
      var isLast = j === pts.length - 1;
      svg.appendChild(el("circle", {
        cx: x, cy: y, r: isLast ? 4.5 : 3.5,
        fill: C.accent, stroke: C.surface, "stroke-width": 2
      }));
      if (isLast) {
        svg.appendChild(el("text", {
          x: x + 8, y: y + 4, "font-size": 12, "font-weight": 700, fill: C.ink,
          "font-family": "inherit", style: "font-variant-numeric: tabular-nums"
        }, nfKg.format(p.value)));
      }
    });

    chartWrap.insertBefore(svg, tooltipEl);
    chartGeom = { pts: pts, X: X, Y: Y, svg: svg, crosshair: crosshair, metric: metric, padTop: pad.top, W: W };
  }

  function chartHover(evt) {
    if (!chartGeom) return;
    var rect = chartGeom.svg.getBoundingClientRect();
    var sx = chartGeom.W / rect.width;
    var mx = (evt.clientX - rect.left) * sx;
    var best = null, bd = Infinity;
    chartGeom.pts.forEach(function (p) {
      var x = chartGeom.X(parseDate(p.date).getTime());
      var d = Math.abs(x - mx);
      if (d < bd) { bd = d; best = { p: p, x: x }; }
    });
    if (!best) return;
    var y = chartGeom.Y(best.p.value);
    chartGeom.crosshair.setAttribute("x1", best.x);
    chartGeom.crosshair.setAttribute("x2", best.x);
    chartGeom.crosshair.setAttribute("opacity", 0.6);

    var e = best.p.entry;
    var lines = [dfLong.format(parseDate(best.p.date)), nfKg.format(best.p.value) + " kg"];
    if (chartGeom.metric !== "weight") lines[1] += " (" + (chartGeom.metric === "volume" ? "volumen" : "est. 1RM") + ")";
    if (e && e.sets != null && e.reps != null) {
      lines.push(chartGeom.metric === "weight"
        ? e.sets + " × " + e.reps
        : nfKg.format(e.weight) + " kg · " + e.sets + " × " + e.reps);
    }
    tooltipEl.innerHTML = "";
    lines.forEach(function (t, j) {
      var d = document.createElement("div");
      if (j === 1) d.style.fontWeight = "700";
      d.textContent = t;
      tooltipEl.appendChild(d);
    });
    tooltipEl.style.left = (best.x / sx) + "px";
    tooltipEl.style.top = (y / sx) + "px";
    tooltipEl.style.display = "block";
  }

  function chartLeave(evt) {
    /* Touch-pointere "forlader" altid grafen når fingeren løftes —
       dér skal tooltippen blive stående til man trykker udenfor. */
    if (evt && evt.pointerType === "touch") return;
    tooltipEl.style.display = "none";
    if (chartGeom) chartGeom.crosshair.setAttribute("opacity", 0);
  }

  chartWrap.addEventListener("pointermove", chartHover);
  chartWrap.addEventListener("pointerdown", chartHover);
  chartWrap.addEventListener("pointerleave", chartLeave);
  document.addEventListener("pointerdown", function (evt) {
    if (!chartWrap.contains(evt.target)) chartLeave();
  });

  /* Stepper-knapper: ±2,5 kg på vægt, ±1 på sæt/reps */
  formEl.addEventListener("click", function (evt) {
    var btn = evt.target.closest("button.step");
    if (!btn) return;
    var input = $(btn.dataset.for);
    var delta = parseFloat(btn.dataset.step);
    var cur = parseFloat(input.value);
    if (!isFinite(cur)) cur = 0;
    var next = Math.round((cur + delta) * 100) / 100;
    var min = input.min !== "" ? parseFloat(input.min) : -Infinity;
    var max = input.max !== "" ? parseFloat(input.max) : Infinity;
    input.value = Math.min(max, Math.max(min, next));
  });

  /* ---------- Historik ---------- */
  function renderHistory() {
    var ex = currentExercise();
    var list = entriesFor(ex.id).slice().reverse();
    historyBody.innerHTML = "";
    if (!list.length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 5;
      td.style.color = "var(--muted)";
      td.textContent = "Ingen registreringer endnu.";
      tr.appendChild(td);
      historyBody.appendChild(tr);
      return;
    }
    var chrono = entriesFor(ex.id);
    var runningBest = {};
    var bestSoFar = null;
    chrono.forEach(function (e) {
      var isPr = bestSoFar == null ? false
        : ex.invert ? e.weight < bestSoFar : e.weight > bestSoFar;
      runningBest[e.id] = isPr;
      if (bestSoFar == null) bestSoFar = e.weight;
      else bestSoFar = ex.invert ? Math.min(bestSoFar, e.weight) : Math.max(bestSoFar, e.weight);
    });

    list.forEach(function (e) {
      var tr = document.createElement("tr");

      var tdD = document.createElement("td");
      tdD.textContent = dfLong.format(parseDate(e.date)) + (e.ts ? " · " + tfShort.format(new Date(e.ts)) : "");
      tr.appendChild(tdD);

      var tdW = document.createElement("td");
      tdW.className = "num";
      tdW.textContent = nfKg.format(e.weight) + " kg";
      if (runningBest[e.id]) {
        var chip = document.createElement("span");
        chip.className = "pr-chip";
        chip.textContent = "PR";
        tdW.appendChild(chip);
      }
      tr.appendChild(tdW);

      var tdSR = document.createElement("td");
      tdSR.className = "num";
      tdSR.textContent = e.sets != null && e.reps != null ? e.sets + " × " + e.reps : "—";
      tr.appendChild(tdSR);

      var tdV = document.createElement("td");
      tdV.className = "num";
      var v = volume(e);
      tdV.textContent = v != null ? nfInt.format(v) : "—";
      tr.appendChild(tdV);

      var tdX = document.createElement("td");
      tdX.className = "num";
      var del = document.createElement("button");
      del.type = "button";
      del.className = "danger-link";
      del.textContent = "Slet";
      del.setAttribute("aria-label", "Slet registrering fra " + dfLong.format(parseDate(e.date)));
      del.addEventListener("click", function () {
        if (!confirm("Slet registreringen fra " + dfLong.format(parseDate(e.date)) + " (" + nfKg.format(e.weight) + " kg)?")) return;
        state.entries = state.entries.filter(function (x) { return x.id !== e.id; });
        saveState(state);
        refresh();
      });
      tdX.appendChild(del);
      tr.appendChild(tdX);

      historyBody.appendChild(tr);
    });
  }

  /* ---------- Interaktion ---------- */
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 4500);
  }

  selectEl.addEventListener("change", function () {
    state.ui.exId = selectEl.value;
    saveState(state);
    refresh();
  });

  metricGroup.addEventListener("click", function (evt) {
    var btn = evt.target.closest("button[data-metric]");
    if (!btn) return;
    state.ui.metric = btn.dataset.metric;
    saveState(state);
    Array.prototype.forEach.call(metricGroup.children, function (b) {
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    renderChart();
  });

  formEl.addEventListener("submit", function (evt) {
    evt.preventDefault();
    var ex = currentExercise();
    var weight = parseFloat(wEl.value);
    var sets = parseInt(sEl.value, 10);
    var reps = parseInt(rEl.value, 10);
    var date = todayISO();
    if (!isFinite(weight) || weight < 0 || !isFinite(sets) || !isFinite(reps)) return;

    var prev = entriesFor(ex.id);
    var prevBest = prev.length
      ? prev.reduce(function (m, e) { return ex.invert ? Math.min(m, e.weight) : Math.max(m, e.weight); }, prev[0].weight)
      : null;

    state.entries.push({ id: uid(), exId: ex.id, date: date, ts: Date.now(), weight: weight, sets: sets, reps: reps });
    saveState(state);
    refresh();

    var isPr = prevBest != null && (ex.invert ? weight < prevBest : weight > prevBest);
    if (isPr) {
      var diff = Math.abs(weight - prevBest);
      showToast("Ny PR på " + ex.name + "! " + nfKg.format(weight) + " kg (" + (ex.invert ? "−" : "+") + nfKg.format(diff) + " kg)");
    } else {
      showToast("Gemt: " + nfKg.format(weight) + " kg · " + sets + " × " + reps);
    }
  });

  $("btn-export").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "traeningslog-backup-" + todayISO() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("btn-import").addEventListener("click", function () { $("import-file").click(); });
  $("import-file").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var s = JSON.parse(reader.result);
        if (!s || !Array.isArray(s.exercises) || !Array.isArray(s.entries)) throw new Error("bad shape");
        if (!confirm("Erstat alle nuværende data med den importerede fil?")) return;
        state = s;
        state.ui = state.ui || { exId: state.exercises[0].id, metric: "weight" };
        saveState(state);
        renderSelect();
        refresh();
        showToast("Data importeret.");
      } catch (e) {
        alert("Filen kunne ikke læses som en gyldig backup af træningsloggen.");
      }
    };
    reader.readAsText(file);
    this.value = "";
  });

  $("btn-reset").addEventListener("click", function () {
    if (!confirm("Slet ALLE registreringer og start forfra med programmets startvægte?")) return;
    state = seedState();
    saveState(state);
    renderSelect();
    refresh();
    showToast("Nulstillet til startvægte.");
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderChart, 150);
  });

  function refresh() {
    renderExerciseMeta();
    renderStats();
    renderChart();
    renderHistory();
  }

  renderSelect();
  refresh();
})();
</script>
</body>
</html>
